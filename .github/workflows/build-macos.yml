name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: macos/build-requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: macos/runtime-package-lock.json
      - name: Provision pinned Audiveris arm64 build input
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          dmg="$RUNNER_TEMP/Audiveris-5.11.0-arm64.dmg"
          mount_dir="$RUNNER_TEMP/audiveris-mount"
          destination="$RUNNER_TEMP/elren-audiveris"
          mkdir -p "$mount_dir" "$destination"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            'https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-macosx-arm64.dmg' -o "$dmg"
          echo "17491af8b6d40153b031dd1f0815e37213f0999ef23f10586af46706e59b2eb6  $dmg" | shasum -a 256 -c -
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          ditto "$mount_dir/Audiveris.app" "$destination/Audiveris.app"
          python macos/bundle_audiveris.py "$destination/Audiveris.app/Contents" --check-only
          echo "ELREN_AUDIVERIS_SOURCE=$destination/Audiveris.app/Contents" >> "$GITHUB_ENV"
      - name: Provision hash-verified OCR model cache
        run: |
          python macos/provision_ocr_models.py --download-to "$RUNNER_TEMP/elren-ocr-cache"
          echo "ELREN_OCR_MODEL_CACHE=$RUNNER_TEMP/elren-ocr-cache" >> "$GITHUB_ENV"
      - name: Install locked quality-gate dependencies
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
          .ci-venv/bin/python -m pip install --disable-pip-version-check --build-constraint macos/build-requirements.lock --requirement macos/build-requirements.lock
      - name: Quality gates
        run: |
          .ci-venv/bin/python -m pip check
          .ci-venv/bin/python -m pytest -q
          .ci-venv/bin/python -m ruff check .
          node --check deepdesk/static/app.js
      - name: Build Elren
        run: chmod +x macos/build-macos-app.sh && macos/build-macos-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Elren-v1.0-macOS
          path: |
            dist/Elren-v1.0-macOS-*.zip
            dist/Elren-v1.0-macOS-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
