name: Core source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - name: Install source and development dependencies
        run: python -m pip install -e ".[dev]" build
      - name: Validate dependency metadata
        run: python -m pip check
      - name: Python syntax and frontend syntax
        run: |
          python -m compileall -q deepdesk launcher macos
          node --check deepdesk/static/app.js
      - name: Full first-party Python lint
        run: python -m ruff check .
      - name: Offline core regression tests (no credentials or desktop input)
        run: >-
          python -m pytest -q tests/test_release_archive.py
          tests/test_repository_delivery.py tests/test_prompt_module_scope.py
          tests/test_agent_deep_validation.py
          tests/test_artifact_request_scope.py tests/test_mobile_verification_policy.py
          tests/test_mobile_efficiency.py
          tests/test_demo_regressions.py
      - name: Build Python distributions
        run: python -m build
      - name: Compile Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./launcher/build-launcher.ps1
