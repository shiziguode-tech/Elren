name: Build Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - 'mobile/ElrenMobile/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'mobile/ElrenMobile/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/ElrenMobile/*.gradle.kts
            mobile/ElrenMobile/gradle/wrapper/gradle-wrapper.properties
            mobile/ElrenMobile/app/*.gradle.kts
      - name: Verify the official Gradle wrapper JAR
        run: echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  mobile/ElrenMobile/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -
      - name: Test, lint, and build debug APK
        run: |
          chmod +x mobile/ElrenMobile/gradlew
          ./mobile/ElrenMobile/gradlew -p mobile/ElrenMobile --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
